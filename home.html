<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Mfs</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwind and daisyUi cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font family -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- font awesome cdn -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
    
</head>

<body class="min-h-screen max-w-md bg-blue-100 mx-auto rounded-xl my-5">
        <!-- available balnace section -->
    <section class="flex justify-between items-center max-w-[406px] mx-auto py-4">
        <div class="flex items-center gap-2">
        <img class="w-[80px]" src="./assets/logo.png" alt="">
        <div>
            <h2 class="font-bold text-2xl">$45000</h2>
        <p class="opacity-60">Available Balance</p>
        </div>
    </div>
    <div>
         <button class="btn btn-primary btn-outline">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</button>
    </div>
    </section>
    <hr class="text-gray-300">
    
    <!-- welcome section -->
     <section class="max-w-[406px] mx-auto py-4">
        <h3 class="font-bold text-2xl">Welcome to Pay<span class="text-primary">oo</span></h3>
        <p class="opacity-60">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
     </section>

     <!-- cards section -->
      <section class="max-w-[406px] mx-auto py-6 grid grid-cols-3 gap-2">

        <!-- add money -->
        <button class="btn btn-outline btn-primary text-neutral px-6 py-8 flex">
            <img src="./assets/opt-1.png" alt="">
            Add Money
        </button>
        <!-- cashout -->
        <button class="btn btn-outline btn-primary text-neutral px-6 py-8 flex">
            <img src="./assets/opt-2.png" alt="">
            Cashout
        </button>

        <!-- Transfer Money -->
        <button class="btn btn-outline btn-primary text-neutral px-6 py-8 flex">
            <img src="./assets/opt-3.png" alt="">
            Transfer Money
        </button>
        <!-- get bonnus -->
        <button class="btn btn-outline btn-primary text-neutral px-6 py-8 flex">
            <img src="./assets/opt-4.png" alt="">
            Get Bonus
        </button>
        <!-- pay bil -->
        <button class="btn btn-outline btn-primary text-neutral px-6 py-8 flex">
            <img src="./assets/opt-1.png" alt="">
            Pay Bil
        </button>

        <!-- transactions -->
        <button class="btn btn-outline btn-primary text-neutral px-6 py-8 flex">
            <img src="./assets/opt-5.png" alt="">
            Transactions
        </button>
      </section>

      <!-- latest Payment Section -->
       <section class="bg-blue-200 min-h-[300px]">
        <div class="flex items-center justify-between py-4 max-w-[406px] mx-auto">
            <h3 class="text-lg font-bold">Latest Payment</h3>
        <button class="opacity-50 font-bold">View All</button>
        </div>


        <!-- here can be transaction history -->
       </section>

    <!-- script -->
    
</body>
</html>
