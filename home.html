<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Mfs</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwind and daisyUi cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font family -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- font awesome cdn -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
    
</head>

<body class="min-h-screen max-w-md bg-blue-100 mx-auto rounded-xl my-5">
        <!-- available balnace section -->
    <section class="flex justify-between items-center max-w-[406px] mx-auto py-4">
        <div class="flex items-center gap-2">
        <img class="w-[80px]" src="./assets/logo.png" alt="">
        <div>
            <h2 class="font-bold text-2xl">$<span id="main-balance">45000</span></h2>
        <p class="opacity-60">Available Balance</p>
        </div>
    </div>
    <div>
         <button class="btn btn-primary btn-outline">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</button>
    </div>
    </section>
    <hr class="text-gray-300">
    
    <!-- welcome section -->
     <section class="max-w-[406px] mx-auto py-4">
        <h3 class="font-bold text-2xl">Welcome to Pay<span class="text-primary">oo</span></h3>
        <p class="opacity-60">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
     </section>

     <!-- cards section -->
      <section class="max-w-[406px] mx-auto py-6 grid grid-cols-3 gap-2">

        <!-- add money -->
        <button class="btn btn-outline btn-primary hover:text-white flex-col text-neutral px-6 py-8 flex">
            <img src="./assets/opt-1.png" alt="">
            Add Money
        </button>
        <!-- cashout -->
        <button class="btn btn-outline btn-primary text-neutral hover:text-white flex-col px-6 py-8 flex">
            <img src="./assets/opt-2.png" alt="">
            Cashout
        </button>

        <!-- Transfer Money -->
        <button class="btn text-xs btn-outline btn-primary text-neutral hover:text-white flex-col px-6 py-8 flex">
            <img src="./assets/opt-3.png" alt="">
            Transfer Money
        </button>
        <!-- get bonnus -->
        <button class="btn btn-outline btn-primary text-neutral hover:text-white flex-col px-6 py-8 flex">
            <img src="./assets/opt-4.png" alt="">
            Get Bonus
        </button>
        <!-- pay bil -->
        <button class="btn btn-outline btn-primary text-neutral hover:text-white flex-col px-6 py-8 flex">
            <img src="./assets/opt-1.png" alt="">
            Pay Bil
        </button>

        <!-- transactions -->
        <button class="btn btn-outline btn-primary flex-col hover:text-white text-neutral px-6 py-8 flex">
            <img src="./assets/opt-5.png" alt="">
            Transactions
        </button>
      </section>

      <!-- latest Payment Section -->
       <section class="hidden bg-blue-200 min-h-[300px]">
        <div class="flex items-center justify-between py-4 max-w-[406px] mx-auto">
            <h3 class="text-lg font-bold">Latest Payment</h3>
        <button class="opacity-50 font-bold">View All</button>
        </div>


        <!-- here can be transaction history -->
       </section>


       <!-- --------------------------------- -->
       <!-- cashout section -->
     <div class="hidden card bg-base-100 w-11/12 shrink-0 shadow mx-auto rounded-2xl">
      <div class="card-body">
        <h2 class="text-center text-secondary font-bold text-lg">Cashout Here</h2>
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold text-lg">Agent Number</label>
          <input id="agent-number" maxlength="11" minlength="11" type="text" class="input bg-base-200 rounded-full w-full" placeholder="Enter Your 11 Digit Agent Number" />
          <label class="label text-neutral font-bold text-lg">Amount</label>
          <input id="cash-out-amount" type="text" class="input bg-base-200 rounded-full w-full" placeholder="Enter Amount" />
          <label class="label text-neutral font-bold text-lg">4 Digit Pin</label>
          <input id="cashout-pin" maxlength="4" type="password" class="input bg-base-200 rounded-full w-full" placeholder="Enter 4 Digit Pin" />
          <br>
          <button id="cashout-btn" class="btn btn-secondary mt-4 font-bold text-lg rounded-full">Cash Out</button>
        </fieldset>
      </div>
    </div>

    <!-- add money section -->
     <div class="card bg-base-100 w-11/12 shrink-0 shadow mx-auto rounded-2xl">
      <div class="card-body">
        <h2 class="text-center text-primary font-bold text-lg">Add Money Here</h2>
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold text-lg">Agent Number</label>
          <input id="add-money-agent" maxlength="11" minlength="11" type="text" class="input bg-base-200 rounded-full w-full" placeholder="Enter Your 11 Digit Agent Number" />
          <label class="label text-neutral font-bold text-lg">Amount</label>
          <input id="add-money-amount" type="text" class="input bg-base-200 rounded-full w-full" placeholder="Enter Amount" />
          <label class="label text-neutral font-bold text-lg">4 Digit Pin</label>
          <input id="add-money-pin" maxlength="4" type="password" class="input bg-base-200 rounded-full w-full" placeholder="Enter 4 Digit Pin" />
          <br>
          <button id="add-money-btn" class="btn btn-primary mt-4 font-bold text-lg rounded-full">Add Money</button>
        </fieldset>
      </div>
    </div>
        

    <!-- script -->
     <script src="utilities.js"></script>
     <script src="./features/cashout.js"></script>
     <script src="./features/addmoney.js"></script>
    
</body>
</html>
