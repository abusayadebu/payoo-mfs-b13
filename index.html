<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Mfs</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwind and daisyUi cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font family -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- font awesome cdn -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
    
</head>

<body class="min-h-screen max-w-md bg-blue-100 mx-auto rounded-xl my-5 flex flex-col justify-center items-center">
        <!-- logo div -->
    <div class="w-[200px] mx-auto my-8">
        <img src="./assets/Logo-full.png" alt="">
    </div>

    <!-- login form section -->
     <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold text-lg">Phone Number</label>
          <input id="number-input" maxlength="11" minlength="11" type="text" class="input bg-base-200 rounded-full" placeholder="Enter Your 11 Digit Phon Number" />
          <label class="label text-neutral font-bold text-lg">4 Digit Pin</label>
          <input id="pin-input" maxlength="4" type="password" class="input bg-base-200 rounded-full" placeholder="Enter 4 Digit Pin" />
          <button id="login-btn" class="btn btn-primary mt-4 font-bold text-lg rounded-full">Login</button>
        </fieldset>
      </div>
    </div>


    <!-- script -->
     <script src="./utilities.js"></script>
     <script src="./features/login.js"></script>
</body>
</html>
